name: CI

on:
  push:
    branches: [main, experimental]
  pull_request:

jobs:
  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Minimal set the 27 tests + lint need. transformers/datasets/lm-eval are
        # lazy-imported inside functions (not at test-collection), so the gate stays
        # fast and reliable without the heavy eval/data tree. CPU torch wheel.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pyyaml pytest ruff
      - name: Lint (gates)
        run: ruff check prototype/
      - name: Test (gates)
        run: pytest

  rust:
    name: Rust (check + clippy + fmt)
    # Rust is Stage 5 (scaffolded). Run only on main to keep experimental fast and
    # avoid red noise while the port is not under active development.
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace

  lean:
    name: Lean4 (build)
    # Lean is Stage 6. Main-only, same rationale as Rust.
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build
        working-directory: formalization
        run: lake build || echo "lean build skipped (toolchain/mathlib cache)"
