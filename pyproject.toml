[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hagi"
version = "0.1.0"
dependencies = [
    "numpy",
    "torch",
    "pyyaml",
    "typer",
    "pexpect",
    "pytest",
    "datasets",
    "transformers",
]

[project.optional-dependencies]
lm-eval = ["lm-eval"]

[project.scripts]
hagi-train = "hagi.train.cli:main"
hagi-eval = "hagi.eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.basedpyright]
pythonVersion = "3.13"
extraPaths = ["src", "scripts"]
reportMissingTypeStubs = "none"
reportMissingImports = "none"
reportIncompatibleMethodOverride = "none"
reportRedeclaration = "none"
reportPrivateImportUsage = "none"
# HAGI uses conditional/deferred attribute registration as a design pattern:
# GDR legacy-layout rebuild (gdr._build_legacy_mlps), fused qkv/gate_up
# (transformer), and register_buffer buffers. These attrs are always set before
# use but not in the class body / __init__, so the rule is noise, not signal.
reportUninitializedInstanceVariable = "none"
