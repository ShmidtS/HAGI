# Canonical RTX 3070 8GB config — v3 multilingual implementation
# Source of truth: .omc/ultragoal/briefs/hagi-rtx3070-multilingual-data-v3.md
name: rtx3070_canonical

model:
  vocab_size: 49152                # SmolLM2 BPE
  hidden_size: 768
  perception_layers: 4
  reasoning_layers: 4
  expression_layers: 4
  loop_count: 1
  use_loop: true
  use_gdr: true
  hdim_full: true                  # arch_decision §HDIM gate: enabled
  use_hdim_cross_domain: true      # arch_decision §HDIM gate: enabled
  hdim_heads: 4
  hdim_delay_steps: 1
  hrm: true
  hrm_h_cycles: 1                  # arch_decision §HRM (h=1)
  hrm_l_cycles: 2                  # arch_decision §HRM (l=2)
  h_dim: 256
  l_dim: 256
  rotor_seed: 42
  use_msa: true                   # arch_decision §MSA: enabled
  msa_slot_count: 100
  msa_top_k: 5
  use_nars: true                   # arch_decision §NARS: enabled
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_intermediate_size: 512
  gradient_checkpointing: false
  transformer:
    hidden_size: 768
    num_query_heads: 12
    num_kv_heads: 4
    intermediate_size: 2048
    rope_theta: 10000.0
    max_seq_len: 2048
    norm: rmsnorm                  # arch_decision §Norm
    qk_norm: true                  # arch_decision §Norm
  grades:
    scalar: 64
    vector: 192
    bivector: 192
    trivector: 64
    residual: 256

training:
  optimizer: muon_adamw            # arch_decision §Optimizer
  muon_lr: 0.02
  adamw_lr: 0.0003
  muon_momentum: 0.95
  muon_ns_steps: 5
  schedule: wsd                    # arch_decision §Schedule
  warmup_steps: 400                # 5% of 8000 (was 5% of 4000)
  cooldown_frac: 0.05
  min_lr_ratio: 0.1
  max_steps: 8000                  # 2x v2 (4h -> 8h on RTX 3070)
  batch_size: 2
  grad_accum_steps: 8
  precision: fp16
  weight_decay: 0.1
  grad_clip: 1.0
  gradient_checkpointing: false
  use_prefix_lm: false
  loss_warmup_mode: linear
  ema:
    decay: 0.9995
    start_step: 800                # 10% of 8000
  composite_loss:
    w_ce: 1.0
    w_aux: 0.1
    w_iso: 0.01
  magic_norm_max: 1.0
  eval_interval: 0
  eval_samples: 500
  log_interval: 25
  ckpt_interval: 1000              # 8 ckpts (was 8 at 500)
  seed: 42

data:
  tokenizer: HuggingFaceTB/SmolLM2-135M
  train_tokens: 150000000          # 3x v2 (was 200M cap on 49M unique; now 150M unique target)
  max_seq_len: 1024
  packing: bfd
  dataset_mode: memmap_packed
  num_workers: 0
  pin_memory: true
  mix:                             # v3 150M (multilingual + math/code)
    edu: 0.3333
    cosmopedia: 0.1333
    wikipedia_en: 0.1667
    wikipedia_ru: 0.1000
    oscar_ru: 0.0667
    openwebmath: 0.0667
    smoltalk: 0.0533
    tinystories: 0.0333
    python_instruct: 0.0267
    openwebtext: 0.0200
  mix_paths:
    - name: edu
      path: edu.bin
      weight: 0.3333
    - name: cosmopedia
      path: cosmopedia.bin
      weight: 0.1333
    - name: wikipedia_en
      path: wikipedia_en.bin
      weight: 0.1667
    - name: wikipedia_ru
      path: wikipedia_ru.bin
      weight: 0.1000
    - name: oscar_ru
      path: oscar_ru.bin
      weight: 0.0667
    - name: openwebmath
      path: openwebmath.bin
      weight: 0.0667
    - name: smoltalk
      path: smoltalk.bin
      weight: 0.0533
    - name: tinystories
      path: tinystories.bin
      weight: 0.0333
    - name: python_instruct
      path: python_instruct.bin
      weight: 0.0267
    - name: openwebtext
      path: openwebtext.bin
      weight: 0.0200

eval:
  every_n_steps: 2000
  benchmarks: [gsm8k, arc_challenge, boolq, hellaswag, winogrande]
