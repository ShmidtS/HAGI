data:
  dataset_mode: memmap_packed
  max_seq_len: 1024
  # Uncomment to enable variable-length training windows. Each sample draws a
  # random length in [min_seq_len, max_seq_len]; the collate fn pads to the
  # batch max with ignore_index so padded positions are loss-free. Leave unset
  # for fixed-length (backward-compatible). The MODEL accepts arbitrary T.
  min_seq_len: 256
  mix:
    edu: 0.4
    slimpajama: 0.25
    wikipedia_en: 0.1
    wikipedia_ru: 0.08
    oscar_ru: 0.07
    openwebmath: 0.03
    smoltalk: 0.03
    tinystories: 0.02
    python_instruct: 0.02
  mix_paths:
  - name: edu
    path: v4_3b/edu.bin
    weight: 0.4
  - name: slimpajama
    path: v4_3b/slimpajama.bin
    weight: 0.25
  - name: wikipedia_en
    path: v4_3b/wikipedia_en.bin
    weight: 0.1
  - name: wikipedia_ru
    path: v4_3b/wikipedia_ru.bin
    weight: 0.08
  - name: oscar_ru
    path: v4_3b/oscar_ru.bin
    weight: 0.07
  - name: openwebmath
    path: v4_3b/openwebmath.bin
    weight: 0.03
  - name: smoltalk
    path: v4_3b/smoltalk.bin
    weight: 0.03
  - name: tinystories
    path: v4_3b/tinystories.bin
    weight: 0.02
  - name: python_instruct
    path: v4_3b/python_instruct.bin
    weight: 0.02
  num_workers: 0
  packing: bfd
  sequential_cycles: 3
  pin_memory: true
  tokenizer: HuggingFaceTB/SmolLM2-135M
  train_tokens: 3000000000
eval:
  benchmarks:
  - gsm8k
  - arc_challenge
  - boolq
  - hellaswag
  - winogrande
  every_n_steps: 2000
model:
  ce_chunk_size: 2048
  compile: true
  use_fused_ce: true
  expression_layers: 4
  grades:
    bivector: 192
    residual: 256
    scalar: 64
    scalar_momentum: 0.5
    trivector: 64
    vector: 192
    vector_momentum: 0.5
  gradient_checkpointing: true
  ce_fused_chunk_size: 2048
  label_smoothing: 0.1
  h_dim: 256
  hdim_delay_steps: 1
  hdim_full: true
  hdim_heads: 4
  hidden_size: 768
  hrm: true
  hrm_h_cycles: 1
  hrm_l_cycles: 2
  l_dim: 256
  loop_count: 10
  moe_alpha: 0.01
  moe_intermediate_size: 512
  moe_top_k: 1
  msa_slot_count: 512
  msa_top_k: 5
  num_experts: 4
  perception_layers: 4
  reasoning_layers: 4
  rotor_seed: 42
  transformer:
    hidden_size: 768
    intermediate_size: 2048
    max_seq_len: 2048
    norm: rmsnorm
    num_kv_heads: 4
    num_query_heads: 12
    qk_norm: true
    rope_theta: 10000.0
    fuse_qkv: true
  use_gdr: true
  use_hdim_cross_domain: true
  use_loop: true
  use_moe: true
  use_msa: true
  use_nars: false
  use_quality_head: false
  vocab_size: 49152
name: rtx3070_canonical
training:
  compile: true
  learning_rate: 0.001
  batch_size: 10
  ckpt_interval: 1000
  composite_loss:
    w_aux: 0.01
    w_ce: 1.0
    w_iso: 0.05
    w_moe: 0.005
    w_msa_lb: 0.01
    w_quality: 0.0
  use_gdr_aux: true
  cooldown_frac: 0.05
  ema:
    decay: 0.9995
    start_step: 500
  eval_interval: 0
  eval_samples: 500
  grad_accum_steps: 2
  grad_clip: 1.0
  gradient_checkpointing: false
  log_interval: 25
  nars_policy_interval: 200
  vram_probe:
    safety: 1.0
    headroom: 0.85
  loss_warmup_mode: linear
  aux_warmup_steps: 2000
  iso_warmup_steps: 3000
  moe_warmup_steps: 2000
  magic_norm_max: 1.0
  max_steps: 8000
  min_lr_ratio: 0.1
  muon_lr: 0.02
  muon_momentum: 0.95
  muon_ns_steps: 5
  optimizer: muon_adamw
  pin_memory: true
  precision: manual_bf16
  schedule: cosine
  seed: 42
  use_prefix_lm: false
  warmup_steps: 500
  weight_decay: 0.1
  num_workers: 0
  compression_monitor:
    enabled: true
    artifact_threshold: 0.5
    calibration_bins: 10
    rank_subsample: 256
    heavy_interval_mult: 4
