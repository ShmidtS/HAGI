data:
  dataset_mode: memmap_packed
  max_seq_len: 1024
  mix:
    cosmopedia: 0.1333
    edu: 0.3333
    openwebmath: 0.0667
    openwebtext: 0.02
    oscar_ru: 0.0667
    python_instruct: 0.0267
    smoltalk: 0.0533
    tinystories: 0.0333
    wikipedia_en: 0.1667
    wikipedia_ru: 0.1
  mix_paths:
  - name: edu
    path: edu.bin
    weight: 0.3333
  - name: cosmopedia
    path: cosmopedia.bin
    weight: 0.1333
  - name: wikipedia_en
    path: wikipedia_en.bin
    weight: 0.1667
  - name: wikipedia_ru
    path: wikipedia_ru.bin
    weight: 0.1
  - name: oscar_ru
    path: oscar_ru.bin
    weight: 0.0667
  - name: openwebmath
    path: openwebmath.bin
    weight: 0.0667
  - name: smoltalk
    path: smoltalk.bin
    weight: 0.0533
  - name: tinystories
    path: tinystories.bin
    weight: 0.0333
  - name: python_instruct
    path: python_instruct.bin
    weight: 0.0267
  - name: openwebtext
    path: openwebtext.bin
    weight: 0.02
  num_workers: 0
  packing: bfd
  pin_memory: true
  tokenizer: HuggingFaceTB/SmolLM2-135M
  train_tokens: 150000000
eval:
  benchmarks:
  - gsm8k
  - arc_challenge
  - boolq
  - hellaswag
  - winogrande
  every_n_steps: 2000
model:
  expression_layers: 4
  grades:
    bivector: 192
    residual: 256
    scalar: 64
    scalar_momentum: 0.5
    trivector: 64
    vector: 192
    vector_momentum: 0.5
  gradient_checkpointing: false
  h_dim: 256
  hdim_delay_steps: 1
  hdim_full: true
  hdim_heads: 4
  hidden_size: 768
  hrm: true
  hrm_h_cycles: 1
  hrm_l_cycles: 2
  l_dim: 256
  loop_count: 1
  moe_alpha: 0.01
  moe_intermediate_size: 1024
  moe_top_k: 1
  msa_slot_count: 100
  msa_top_k: 5
  num_experts: 4
  perception_layers: 4
  reasoning_layers: 4
  rotor_seed: 42
  transformer:
    hidden_size: 768
    intermediate_size: 2048
    max_seq_len: 2048
    norm: rmsnorm
    num_kv_heads: 4
    num_query_heads: 12
    qk_norm: true
    rope_theta: 10000.0
  use_gdr: true
  use_hdim_cross_domain: true
  use_loop: true
  use_moe: true
  use_msa: true
  use_nars: true
  vocab_size: 49152
name: rtx3070_canonical
training:
  learning_rate: 0.0002
  batch_size: 2
  ckpt_interval: 1000
  composite_loss:
    w_aux: 0.05
    w_ce: 1.0
    w_iso: 0.005
    w_moe: 0.005
  use_gdr_aux: true
  cooldown_frac: 0.05
  ema:
    decay: 0.9995
    start_step: 800
  eval_interval: 0
  eval_samples: 500
  grad_accum_steps: 8
  grad_clip: 1.0
  gradient_checkpointing: false
  log_interval: 25
  loss_warmup_mode: linear
  magic_norm_max: 1.0
  max_steps: 8000
  min_lr_ratio: 0.1
  muon_lr: 0.005
  muon_momentum: 0.95
  muon_ns_steps: 3
  optimizer: muon_adamw
  pin_memory: true
  precision: fp16
  schedule: cosine
  seed: 42
  use_prefix_lm: false
  warmup_steps: 400
  weight_decay: 0.1
  num_workers: 0
