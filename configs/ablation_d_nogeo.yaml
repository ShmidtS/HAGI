# Ablation d-nogeo - full GDR but with the geometric-product interaction OFF.
# Phase-1 diagnostic: D (full GDR) lost to B on held-out loss (0/5 seeds). This
# variant keeps the grade split + per-grade momentum + grade MLPs but drops the
# geometric-product cross-grade signal, to isolate whether THAT term is the culprit.
#
# Same params as ablation_d (the unused geo Linear layers still exist) so the only
# difference vs D is the geometric signal itself. Compare D-nogeo vs B vs D on the
# SAME held-out shard / seeds.
name: ablation_d_nogeo
model:
  vocab_size: 49152
  hidden_size: 768
  perception_layers: 4
  reasoning_layers: 4
  expression_layers: 4
  loop_count: 3
  use_loop: true
  use_gdr: true
  ce_chunk_size: 1024
  gradient_checkpointing: false
  transformer:
    num_query_heads: 12
    num_kv_heads: 4
    intermediate_size: 2048
    rope_theta: 10000.0
    max_seq_len: 4096
  grades:
    scalar: 64
    vector: 192
    bivector: 192
    trivector: 64
    residual: 256
    scalar_momentum: 0.9
    vector_momentum: 0.5
    geo_interaction: false

training:
  optimizer: adamw
  precision: bf16
  compile: true
  batch_size: 16
  grad_accum_steps: 4
  learning_rate: 3.0e-4
  warmup_steps: 400
  weight_decay: 0.1
  grad_clip: 1.0
  ckpt_interval: 500
  log_interval: 50
  seed: 42

data:
  tokenizer: "HuggingFaceTB/SmolLM2-135M"
  train_tokens: 500_000_000
  max_seq_len: 1024

eval:
  every_n_steps: 0
  benchmarks: [arc_challenge, boolq, hellaswag, winogrande]
