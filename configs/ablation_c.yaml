# Ablation c — Clifford bolted on (no loop)
# One of four same-size (~115M) models for the GDR ablation. All four share data,
# schedule, tokenizer, and budget; they differ ONLY in use_loop / use_gdr. Sized to
# fit a modest unit budget (seq 1024, 500M tokens) — the B-vs-D comparison is
# relative, so absolute scale matters less than keeping the four identical.
#
# Effective batch = 16 * 4 * 1024 = 65,536 tokens/step. 500M tokens -> ~7,629 steps.
# Run each separately (own --hf-repo / ckpt dir); see docs/ABLATION.md for the order.
name: ablation_c
model:
  vocab_size: 49152
  hidden_size: 768
  perception_layers: 4
  reasoning_layers: 4
  expression_layers: 4
  loop_count: 1
  use_loop: false
  use_gdr: true
  ce_chunk_size: 1024
  gradient_checkpointing: false
  transformer:
    num_query_heads: 12
    num_kv_heads: 4
    intermediate_size: 2048
    rope_theta: 10000.0
    max_seq_len: 4096
  grades:
    scalar: 64
    vector: 192
    bivector: 192
    trivector: 64
    residual: 256
    scalar_momentum: 0.9
    vector_momentum: 0.5

training:
  optimizer: adamw
  precision: bf16
  compile: true
  batch_size: 16
  grad_accum_steps: 4          # effective batch = 16 * 4 * 1024 = 65,536 tokens/step
  learning_rate: 3.0e-4
  warmup_steps: 400
  weight_decay: 0.1
  grad_clip: 1.0
  ckpt_interval: 500
  log_interval: 50
  seed: 42

data:
  tokenizer: "HuggingFaceTB/SmolLM2-135M"
  train_tokens: 500_000_000
  max_seq_len: 1024

eval:
  every_n_steps: 0
  benchmarks: [arc_challenge, boolq, hellaswag, winogrande]
