# Micro ablation B - recurrence only, ~38M, sized for LOCAL diagnosis (4GB Ampere).
# Purpose: cheap local harness to (1) reproduce the B-vs-D ordering at micro scale,
# then (2) test fixes (gated GDR) for free before spending any cloud budget.
# Same shape family as ablation_b at half width. seq 512, 25M tokens.
# Effective batch = 4 * 8 * 512 = 16,384 tokens/step -> 25M tokens = ~1,526 steps.
# batch 4 (not 8): 4GB card OOMs at batch 8 even uncompiled; accum 8 keeps the
# effective batch identical.
name: micro_b
model:
  vocab_size: 49152
  hidden_size: 384
  perception_layers: 4
  reasoning_layers: 4
  expression_layers: 4
  loop_count: 3
  use_loop: true
  use_gdr: false
  ce_chunk_size: 1024
  gradient_checkpointing: false
  transformer:
    num_query_heads: 6
    num_kv_heads: 2
    intermediate_size: 1024
    rope_theta: 10000.0
    max_seq_len: 2048

training:
  optimizer: adamw
  precision: bf16
  compile: true
  batch_size: 4
  grad_accum_steps: 8          # effective batch = 4 * 8 * 512 = 16,384 tokens/step
  learning_rate: 3.0e-4
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  ckpt_interval: 500
  log_interval: 50
  seed: 42

data:
  tokenizer: "HuggingFaceTB/SmolLM2-135M"
  train_tokens: 25_000_000
  max_seq_len: 512

eval:
  every_n_steps: 0
  benchmarks: []
